<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Big-Up — Mentions légales</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500&display=swap" />
    <link rel="stylesheet" href="../assets/tailwind.css" />
  </head>
  <body class="bg-brand-cream text-brand-text">
    <header class="bg-white shadow-brand">
      <div class="section-wrap flex items-center justify-between py-4">
        <a href="../index.html" class="logo">
          <span class="logo-dot" aria-hidden="true"></span>
          <span>Big-Up</span>
        </a>
        <a href="../index.html" class="text-sm font-heading font-semibold text-brand-teal hover:underline" data-legal-back-fr="Retour à l'accueil" data-legal-back-en="Back to home">Retour à l'accueil</a>
      </div>
    </header>

    <main class="section-wrap max-w-3xl py-16 lg:py-24">
      <h1 class="font-heading font-extrabold text-3xl md:text-4xl text-brand-dark mb-6">Mentions légales</h1>
      <p class="text-lg text-brand-muted leading-relaxed mb-4"
         data-stub-fr="Cette page est en cours de rédaction et sera disponible prochainement."
         data-stub-en="This page is being drafted and will be available shortly.">Cette page est en cours de rédaction et sera disponible prochainement.</p>
      <p class="text-brand-muted leading-relaxed"
         data-contact-fr="Pour toute question, contactez-nous à"
         data-contact-en="For any question, contact us at">Pour toute question, contactez-nous à <a href="mailto:contact@big-up.ai" class="text-brand-teal underline">contact@big-up.ai</a>.</p>
    </main>

    <footer class="bg-brand-darker text-white py-10">
      <div class="section-wrap text-center text-white/40 text-sm">© 2026 Big-Up.</div>
    </footer>

    <script>
      (function () {
        const stored = localStorage.getItem('bigup.lang');
        const lang = stored === 'en' ? 'en' : (navigator.language || 'fr').toLowerCase().startsWith('fr') ? 'fr' : 'en';
        document.documentElement.lang = lang;
        if (lang === 'en') {
          document.title = 'Big-Up — Legal mentions';
          document.querySelector('h1').textContent = 'Legal mentions';
          document.querySelectorAll('[data-stub-en]').forEach((el) => (el.textContent = el.dataset.stubEn));
          document.querySelectorAll('[data-contact-en]').forEach((el) => {
            el.innerHTML = el.dataset.contactEn + ' <a href="mailto:contact@big-up.ai" class="text-brand-teal underline">contact@big-up.ai</a>.';
          });
          document.querySelectorAll('[data-legal-back-en]').forEach((el) => (el.textContent = el.dataset.legalBackEn));
        }
      })();
    </script>
  </body>
</html>
