<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1AADA3" />
    <meta name="color-scheme" content="light" />

    <title data-i18n="meta.title">Big-Up</title>
    <meta name="description" data-i18n-attr="content:meta.description" content="" />

    <meta property="og:type" content="website" />
    <meta property="og:title" data-i18n-attr="content:meta.title" content="" />
    <meta property="og:description" data-i18n-attr="content:meta.description" content="" />
    <meta property="og:image" content="assets/og-image.png" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="canonical" href="https://big-up.ai/" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap"
    />

    <link rel="stylesheet" href="assets/tailwind.css" />
  </head>

  <body>
    <a href="#main" class="skip-link" data-i18n="skip.toMain">Aller au contenu principal</a>

    <!-- ============== NAV ============== -->
    <nav id="site-nav" class="site-nav" aria-label="Primary">
      <a href="#top" class="logo" aria-label="Big-Up">
        <span class="logo-dot" aria-hidden="true"></span>
        <span data-i18n="logo.name">Big-Up</span>
      </a>

      <ul class="hidden lg:flex items-center gap-10 list-none">
        <li><a href="#piliers" class="nav-link" data-i18n="nav.features"></a></li>
        <li><a href="#how" class="nav-link" data-i18n="nav.howItWorks"></a></li>
        <li><a href="#temoignages" class="nav-link" data-i18n="nav.testimonials"></a></li>
        <li><a href="#contact" class="nav-link" data-i18n="nav.contact"></a></li>
      </ul>

      <div class="flex items-center gap-3">
        <div
          class="lang-pill"
          role="group"
          data-i18n-attr="aria-label:lang.toggleLabel"
          aria-label=""
        >
          <button type="button" data-lang="fr" aria-pressed="true" data-i18n="lang.fr">FR</button>
          <button type="button" data-lang="en" aria-pressed="false" data-i18n="lang.en">EN</button>
          <button type="button" data-lang="es" aria-pressed="false" data-i18n="lang.es">ES</button>
        </div>

        <!-- [18A-1] Log in - a native <details>, so it works with JS disabled.
             [ROUND 2] That claim was half true: the hrefs worked, but every label
             was an empty data-i18n node, so with JS off it rendered as a bare
             chevron opening onto two invisible links. The auth controls now carry
             French default text in the markup - French because it is the launch
             market and the site's own fallback - which the dictionary replaces.
             The rest of the client's page still needs JS for its text; that is
             the client's architecture and this epic does not change it.
             Two doors framed by INTENT, never a dropdown of "Talent"/"Recruiter":
             those are our words, not the visitor's. -->
        <!-- Desktop only. The same two doors are full-width items in the mobile
             drawer (the site's own `hidden lg:flex` convention), and the header
             row already does not fit a 320px screen without this. -->
        <details id="login-menu" class="login-menu relative hidden lg:block">
          <summary
            class="nav-link cursor-pointer list-none select-none"
            data-i18n-attr="aria-label:auth.login.choose"
            aria-label="Se connecter — choisissez votre compte"
          ><span data-i18n="auth.login">Se connecter</span></summary>
          <div class="login-menu-panel">
            <a data-auth-link href="https://talent-web-production-a964.up.railway.app/"
               class="login-menu-item" data-i18n="auth.talent.cta">Je cherche un emploi</a>
            <a data-auth-link href="https://recruiter-web-production-ded4.up.railway.app/"
               class="login-menu-item" data-i18n="auth.recruiter.cta">Je recrute</a>
          </div>
        </details>

        <!-- [ROUND 2] Hidden below `sm`. The header row - logo, language pill,
             this button, the menu button - is wider than a phone, and because
             the nav clips rather than scrolls, the MENU BUTTON was the thing
             pushed off-screen: measured live at 360, 375, 390 and 412px in all
             three languages. On a phone that button is the only way to the
             navigation and to "Se connecter". The client's original already lost
             it below 375px in French; the third language button made it every
             phone. This same button is the drawer's own first action, and the
             hero directly below carries both sign-up doors, so nothing becomes
             unreachable - one duplicate moves inside the menu instead. -->
        <a href="#cta" class="nav-cta hidden sm:inline-flex">
          <span data-i18n="nav.start"></span>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </a>

        <button
          type="button"
          id="menu-toggle"
          class="lg:hidden inline-flex items-center justify-center w-11 h-11 rounded-chunk text-brand-dark cursor-pointer"
          aria-controls="mobile-menu"
          aria-expanded="false"
          data-i18n-attr="aria-label:nav.menuOpen"
          aria-label=""
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
      </div>
    </nav>

    <!-- mobile drawer -->
    <div id="mobile-menu" class="lg:hidden hidden fixed top-16 inset-x-0 z-30 bg-white shadow-brand">
      <ul class="section-wrap py-4 flex flex-col gap-2 list-none">
        <li><a href="#piliers" class="block py-2 nav-link" data-i18n="nav.features"></a></li>
        <li><a href="#how" class="block py-2 nav-link" data-i18n="nav.howItWorks"></a></li>
        <li><a href="#temoignages" class="block py-2 nav-link" data-i18n="nav.testimonials"></a></li>
        <li><a href="#contact" class="block py-2 nav-link" data-i18n="nav.contact"></a></li>
        <li class="pt-2"><a href="#cta" class="nav-cta w-full justify-center"><span data-i18n="nav.start"></span></a></li>
        <!-- [18A-1] The same two doors, full-width. Never a dropdown inside a drawer. -->
        <li class="pt-3 mt-1 border-t border-black/5">
          <p class="pt-3 pb-1 text-xs font-semibold uppercase tracking-wide text-brand-muted" data-i18n="auth.login">Se connecter</p>
        </li>
        <li><a data-auth-link href="https://talent-web-production-a964.up.railway.app/"
               class="block py-2 nav-link" data-i18n="auth.talent.cta">Je cherche un emploi</a></li>
        <li><a data-auth-link href="https://recruiter-web-production-ded4.up.railway.app/"
               class="block py-2 nav-link" data-i18n="auth.recruiter.cta">Je recrute</a></li>
      </ul>
    </div>

    <main id="main">
      <span id="top" aria-hidden="true"></span>

      <!-- ============== HERO ============== -->
      <section class="relative overflow-hidden pt-28 lg:pt-36 pb-16 lg:pb-24 min-h-[100vh] grid lg:grid-cols-2 gap-10 lg:gap-16 items-center section-wrap">
        <!-- backgrounds -->
        <div class="absolute inset-0 -z-10 bg-hero-radial pointer-events-none"></div>
        <div class="hero-shape -top-24 -right-16 w-[420px] h-[420px]" aria-hidden="true"></div>

        <div class="relative z-10">
          <p class="hero-tag">
            <svg viewBox="0 0 24 16" class="w-5 h-3.5" aria-hidden="true">
              <rect width="8" height="16" fill="#F77F00" />
              <rect x="8" width="8" height="16" fill="#FFFFFF" />
              <rect x="16" width="8" height="16" fill="#009A6F" />
            </svg>
            <span data-i18n="hero.tag"></span>
          </p>

          <h1 class="mt-6 text-brand-dark font-extrabold leading-[1.08]"
              style="font-size: clamp(2.5rem, 5vw, 4.2rem); animation: fadeUp .6s .1s ease both;">
            <span data-i18n="hero.h1.line1"></span><br />
            <span data-i18n="hero.h1.line2.a"></span>
            <span class="text-brand-teal" data-i18n="hero.h1.line2.b"></span><br />
            <span data-i18n="hero.h1.line3.a"></span>
            <span class="text-brand-orange" data-i18n="hero.h1.line3.b"></span>
          </h1>

          <p class="mt-6 text-lg leading-relaxed text-brand-muted max-w-lg"
             style="animation: fadeUp .6s .2s ease both;"
             data-i18n="hero.subhead"></p>

          <div class="mt-10 flex flex-col sm:flex-row flex-wrap gap-4 items-start" style="animation: fadeUp .6s .3s ease both;">
            <!-- [18A-1] THE TWO DOORS. These replace "Download the app" (which went
                 to #cta) and "Discover" (which went to #piliers). The row is designed
                 to be exactly two buttons wide at every breakpoint and still is.
                 Marketing surfaces SELL, so both go to sign-UP; the header's "Log in"
                 goes to sign-IN. -->
            <a data-auth-link href="https://talent-web-production-a964.up.railway.app/signup" class="btn-primary">
              <span data-i18n="auth.talent.cta">Je cherche un emploi</span>
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </a>
            <a data-auth-link href="https://recruiter-web-production-ded4.up.railway.app/signup" class="btn-secondary">
              <span data-i18n="auth.recruiter.cta">Je recrute</span>
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </a>
          </div>

          <!-- Demo opens the video modal — kept as a quiet inline link so the
               primary CTA row stays two-button-wide on every breakpoint. -->
          <button
            type="button"
            id="open-video"
            class="mt-5 inline-flex items-center gap-2 text-sm font-semibold text-brand-teal hover:text-brand-tealDark transition-colors cursor-pointer"
            aria-haspopup="dialog"
            style="animation: fadeUp .6s .35s ease both;"
          >
            <span class="inline-flex items-center justify-center w-7 h-7 rounded-full bg-brand-teal/10">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="0" class="w-3 h-3" aria-hidden="true"><polygon points="6 4 20 12 6 20 6 4"></polygon></svg>
            </span>
            <span data-i18n="hero.watchDemo"></span>
          </button>

          <!-- Honest KPI strip — visually matches the reference (top border
               separator + big-number hierarchy) while keeping our actual
               Phase-1 numbers. Values are short enough (1-4 chars) to take
               the big font without wrapping. -->
          <div class="mt-10 lg:mt-12 pt-7 lg:pt-8 border-t border-brand-dark/10 flex flex-wrap gap-x-10 lg:gap-x-12 gap-y-6"
               style="animation: fadeUp .6s .4s ease both;">
            <div>
              <div class="font-heading font-extrabold text-3xl md:text-4xl text-brand-dark leading-none whitespace-nowrap tracking-tight"
                   data-i18n="hero.proof.1.value"></div>
              <div class="text-xs md:text-sm text-brand-muted mt-2 font-medium" data-i18n="hero.proof.1.label"></div>
            </div>
            <div>
              <div class="font-heading font-extrabold text-3xl md:text-4xl text-brand-teal leading-none whitespace-nowrap tracking-tight"
                   data-i18n="hero.proof.2.value"></div>
              <div class="text-xs md:text-sm text-brand-muted mt-2 font-medium" data-i18n="hero.proof.2.label"></div>
            </div>
            <div>
              <div class="font-heading font-extrabold text-3xl md:text-4xl text-brand-orange leading-none whitespace-nowrap tracking-tight"
                   data-i18n="hero.proof.3.value"></div>
              <div class="text-xs md:text-sm text-brand-muted mt-2 font-medium" data-i18n="hero.proof.3.label"></div>
            </div>
          </div>
        </div>

        <!-- Hero visual: profile card mockup + floating mini cards -->
        <!-- [ROUND 2] `hero.illustrationAlt` existed in all three languages and was
             bound to nothing, so its rewrite in 18A-4 reached no screen reader.
             The mockup is an illustration; it is described as one. -->
        <div class="relative z-10 hidden lg:block" style="animation: fadeUp .6s .2s ease both;" role="img" aria-label="" data-i18n-attr="aria-label:hero.illustrationAlt">
          <div class="relative p-8">
            <div class="profile-card">
              <div class="profile-card__bar"></div>
              <div class="profile-row">
                <div class="avatar-initial">K</div>
                <div>
                  <h3 class="font-heading font-bold text-base text-brand-dark" data-i18n="hero.card.name"></h3>
                  <p class="text-xs text-brand-muted" data-i18n="hero.card.role"></p>
                </div>
                <span class="badge-verified">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="w-3 h-3" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>
                  <span data-i18n="hero.card.badge"></span>
                </span>
              </div>

              <div class="mb-6">
                <div class="text-xs text-brand-muted mb-2" data-i18n="hero.card.scoreLabel"></div>
                <div class="score-bar-track"><div class="score-bar-fill" style="--score: 92%;"></div></div>
                <div class="font-heading font-extrabold text-2xl text-brand-teal mt-2" data-i18n="hero.card.scoreValue"></div>
              </div>

              <div class="flex flex-wrap gap-2">
                <span class="tag-chip" data-i18n="hero.card.tag1"></span>
                <span class="tag-chip" data-i18n="hero.card.tag2"></span>
                <span class="tag-chip" data-i18n="hero.card.tag3"></span>
                <span class="tag-chip" data-i18n="hero.card.tagMore"></span>
              </div>
            </div>

            <!-- Floating card top-right -->
            <div class="float-card -top-2 -right-4" style="animation-delay: 0s;">
              <div class="float-icon" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><circle cx="12" cy="8" r="6"></circle><polyline points="15.477 12.89 17 22 12 19 7 22 8.523 12.89"></polyline></svg>
              </div>
              <div class="float-label" data-i18n="hero.float.1.label"></div>
              <div class="float-val" data-i18n="hero.float.1.value"></div>
            </div>

            <!-- Floating card bottom-left -->
            <div class="float-card -bottom-2 -left-4" style="animation-delay: 2s;">
              <div class="float-icon is-orange" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
              </div>
              <div class="float-label" data-i18n="hero.float.2.label"></div>
              <div class="float-val" data-i18n="hero.float.2.value"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- ============== MARQUEE (scrolling features strip) ============== -->
      <div class="marquee-wrap" aria-label="Features highlights" role="region">
        <div class="marquee-track">
          <!-- Track duplicated for seamless infinite scroll -->
          <span class="marquee-item"><span class="marquee-dot" aria-hidden="true"></span><span data-i18n="marquee.item1"></span></span>
          <span class="marquee-item"><span class="marquee-dot" aria-hidden="true"></span><span data-i18n="marquee.item2"></span></span>
          <span class="marquee-item"><span class="marquee-dot" aria-hidden="true"></span><span data-i18n="marquee.item3"></span></span>
          <span class="marquee-item"><span class="marquee-dot" aria-hidden="true"></span><span data-i18n="marquee.item4"></span></span>
          <span class="marquee-item"><span class="marquee-dot" aria-hidden="true"></span><span data-i18n="marquee.item5"></span></span>
          <span class="marquee-item"><span class="marquee-dot" aria-hidden="true"></span><span data-i18n="marquee.item6"></span></span>
          <span class="marquee-item" aria-hidden="true"><span class="marquee-dot"></span><span data-i18n="marquee.item1"></span></span>
          <span class="marquee-item" aria-hidden="true"><span class="marquee-dot"></span><span data-i18n="marquee.item2"></span></span>
          <span class="marquee-item" aria-hidden="true"><span class="marquee-dot"></span><span data-i18n="marquee.item3"></span></span>
          <span class="marquee-item" aria-hidden="true"><span class="marquee-dot"></span><span data-i18n="marquee.item4"></span></span>
          <span class="marquee-item" aria-hidden="true"><span class="marquee-dot"></span><span data-i18n="marquee.item5"></span></span>
          <span class="marquee-item" aria-hidden="true"><span class="marquee-dot"></span><span data-i18n="marquee.item6"></span></span>
        </div>
      </div>

      <!-- ============== 3 PILIERS ============== -->
      <section id="piliers" class="relative overflow-hidden bg-brand-dark py-24 lg:py-28">
        <div class="absolute inset-0 bg-pillars-radial pointer-events-none"></div>

        <div class="section-wrap relative z-10">
          <p class="section-label" data-i18n="piliers.label"></p>
          <h2 class="section-title on-dark max-w-2xl" data-i18n="piliers.title"></h2>

          <div class="grid md:grid-cols-3 gap-6 mt-14">
            <article class="pillar-card edtech reveal">
              <span class="pillar-num" aria-hidden="true">01</span>
              <span class="pillar-icon" aria-hidden="true">
                <!-- Lucide GraduationCap -->
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6 text-white"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/></svg>
              </span>
              <h3 data-i18n="piliers.edtech.title"></h3>
              <p data-i18n="piliers.edtech.body"></p>
              <ul>
                <li>
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 mt-0.5 shrink-0" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>
                  <span data-i18n="piliers.edtech.bullet1"></span>
                </li>
                <li>
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 mt-0.5 shrink-0" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>
                  <span data-i18n="piliers.edtech.bullet2"></span>
                </li>
                <li>
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 mt-0.5 shrink-0" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>
                  <span data-i18n="piliers.edtech.bullet3"></span>
                </li>
              </ul>
              <a href="#contact" class="pillar-link">
                <span data-i18n="piliers.edtech.cta"></span>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
              </a>
            </article>

            <article class="pillar-card reseau reveal" style="transition-delay:.1s">
              <span class="pillar-num" aria-hidden="true">02</span>
              <span class="pillar-icon" aria-hidden="true">
                <!-- Lucide Hammer -->
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6 text-white"><path d="m15 12-8.373 8.373a1 1 0 1 1-3-3L12 9"/><path d="m18 15 4-4"/><path d="m21.5 11.5-1.914-1.914A2 2 0 0 1 19 8.172V7l-2.26-2.26a6 6 0 0 0-4.202-1.756L9 2.96l.92.82A6.18 6.18 0 0 1 12 8.4V10l2 2h1.172a2 2 0 0 1 1.414.586L18.5 14.5"/></svg>
              </span>
              <h3 data-i18n="piliers.reseau.title"></h3>
              <p data-i18n="piliers.reseau.body"></p>
              <ul>
                <li>
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 mt-0.5 shrink-0" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>
                  <span data-i18n="piliers.reseau.bullet1"></span>
                </li>
                <li>
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 mt-0.5 shrink-0" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>
                  <span data-i18n="piliers.reseau.bullet2"></span>
                </li>
                <li>
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 mt-0.5 shrink-0" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>
                  <span data-i18n="piliers.reseau.bullet3"></span>
                </li>
              </ul>

    <script>
      (function () {
        // [18A-3] Three locales, matching the platform. The list is the single
        // place a locale is declared - detectInitialLang, setLang and the pill all
        // derive from it, so adding a fourth is one line rather than four edits in
        // four places that can disagree.
        const I18N_URLS = { fr: 'i18n/fr.json', en: 'i18n/en.json', es: 'i18n/es.json' };
        const SUPPORTED = Object.keys(I18N_URLS);
        const OG_LOCALE = { fr: 'fr_FR', en: 'en_US', es: 'es_ES' };
        const STORAGE_KEY = 'bigup.lang';
        /**
         * Did the visitor CHOOSE this language, or did we guess it from the
         * browser? The app writes a handed-over `?lang=` to the account, so the
         * difference decides whether a guess can silently change somebody's
         * email language. See decorateAuthLinks.
         */
        let langWasChosen = false;
        /** The dictionary currently on screen, for strings built by script. */
        let currentDict = {};
        const dictionaries = {};
        let currentLang = 'fr';

        /**
         * [REVIEW FIX - the worst finding] Storage access must never be able to
         * blank the page.
         *
         * Reproduced live: with `localStorage` throwing SecurityError, 202 of
         * 208 translatable nodes rendered EMPTY - the whole marketing site
         * reduced to "Aller au contenu principal Big-Up FR EN ES". One uncaught
         * getItem on the only init path took everything with it.
         *
         * That is not exotic. It is iOS Safari "Block All Cookies", Chrome's
         * "Don't allow sites to save data", Firefox "Block cookies: All", kiosk
         * and managed browsers, and some in-app webviews - in a mobile-first
         * launch market. BOTH product apps already guard these exact two calls
         * and say why; the site dropped the guard.
         */
        function readStored() {
          try {
            return localStorage.getItem(STORAGE_KEY);
          } catch (_) {
            return null;
          }
        }

        function writeStored(value) {
          try {
            localStorage.setItem(STORAGE_KEY, value);
          } catch (_) {
            /* A visitor who blocks storage still gets a working page; they
               simply do not get their choice remembered. */
          }
        }

        function detectInitialLang() {
          // [REVIEW FIX, round 2] The site SENT `?lang=` onward but never READ
          // it, so a campaign, QR code or shared link to the marketing page
          // could not pin a language - the one place such a link is used. An
          // explicit parameter is a choice, on the same reasoning the product
          // apps apply (18-11 H6): a browser default is a guess, a URL someone
          // chose to send is not.
          try {
            const handed = (new URLSearchParams(location.search).get('lang') || '')
              .toLowerCase().split('-')[0];
            if (SUPPORTED.includes(handed)) {
              langWasChosen = true;
              return handed;
            }
          } catch (_) { /* no usable query string */ }
          const stored = readStored();
          // A stored value only exists because the pill was clicked once.
          if (SUPPORTED.includes(stored)) langWasChosen = true;
          if (SUPPORTED.includes(stored)) return stored;
          const nav = (navigator.language || navigator.userLanguage || 'fr').toLowerCase();
          const base = nav.split('-')[0];
          // A regional code (es-419, fr-CI) keeps its base language; anything we do
          // not have falls back to French, which is the launch market.
          return SUPPORTED.includes(base) ? base : 'fr';
        }

        async function loadDict(lang) {
          if (dictionaries[lang]) return dictionaries[lang];
          // [REVIEW FIX] The PRICE fetch checks `res.ok` and has a documented
          // fallback; the STRING fetch, which every visible character depends
          // on, had neither. Reproduced live: fr.json returning 503 produced
          // the same blank page as the storage failure, via
          // `Unexpected token 'u'`. And Caddy caches /i18n for 300s, so a bad
          // deploy's 404 sticks in browsers too.
          const res = await fetch(I18N_URLS[lang]);
          if (!res.ok) throw new Error('i18n ' + lang + ' -> ' + res.status);
          dictionaries[lang] = await res.json();
          return dictionaries[lang];
        }

        function applyDict(dict, lang) {
          document.querySelectorAll('[data-i18n]').forEach((el) => {
            const key = el.getAttribute('data-i18n');
            if (key && dict[key] !== undefined) el.textContent = dict[key];
          });
          document.querySelectorAll('[data-i18n-attr]').forEach((el) => {
            const spec = el.getAttribute('data-i18n-attr');
            spec.split(';').forEach((pair) => {
              const [attr, key] = pair.split(':').map((s) => s && s.trim());
              if (attr && key && dict[key] !== undefined) el.setAttribute(attr, dict[key]);
            });
          });
          document.documentElement.setAttribute('lang', lang);
          document.documentElement.setAttribute('dir', 'ltr');
        }

        /**
         * Returns what happened, because two of the outcomes look alike and must
         * not be treated alike:
         *   'applied'     - this language is on screen now;
         *   'failed'      - its dictionary would not load (fall back);
         *   'superseded'  - a NEWER choice overtook this one (stop - the visitor
         *                   has decided, and falling back would overwrite them).
         * [ROUND 2] The first version returned a boolean, so the init fallback
         * read "a click overtook me" as "my file failed", fell through to the
         * next locale, and replaced the language the visitor had just clicked.
         * The double-click race test caught it.
         */
        async function setLang(lang, persist) {
          if (!SUPPORTED.includes(lang)) return 'failed';
          const previousLang = currentLang;
          currentLang = lang;
          // `persist` is true only when a human clicked the pill. A value we
          // previously stored because of such a click counts too.
          if (persist) langWasChosen = true;
          if (persist) writeStored(lang);
          // [REVIEW FIX] Reproduced live with two ORDINARY clicks 120ms apart:
          // click EN then FR and the page ends up ENGLISH with `fr` in storage,
          // because the second dictionary was already cached and resolved
          // first, so the first click's `applyDict` landed last and won. That
          // is the "the language switcher doesn't work" report, plus a DOM and
          // storage that disagree until the next reload.
          //
          // The guard belongs HERE and not only in renderPricing: with it in
          // one place the failure changes shape rather than going away - chrome
          // and doors flip to the stale language while the prices hold the new
          // one, which is a permanently mixed page.
          let dict;
          try {
            dict = await loadDict(lang);
          } catch (_) {
            // A dictionary that will not load must not take the page down. On a
            // SECOND switch the previous language is still on screen. On FIRST
            // load there is no previous language - the markup's data-i18n nodes
            // are empty - so the caller at init falls back to another locale.
            // [REVIEW FIX, round 2] The first version of this comment claimed
            // the previous language always survives. It does not on first load,
            // and the test that "proved" it reloaded a page whose stored
            // language was English, so it never requested the broken file.
            if (currentLang === lang) {
              currentLang = previousLang;
              return 'failed';
            }
            return 'superseded';
          }
          if (lang !== currentLang) return 'superseded';
          currentDict = dict;
          applyDict(dict, lang);
          document.querySelectorAll('.lang-pill button[data-lang]').forEach((btn) => {
            btn.setAttribute('aria-pressed', btn.dataset.lang === lang ? 'true' : 'false');
          });
          decorateAuthLinks(lang);
          // Re-rendered per language: the period words and the CTA are translated.
          void renderPricing(dict, lang);
          const ogLoc = document.querySelector('meta[property="og:locale"]');
          if (ogLoc) ogLoc.setAttribute('content', OG_LOCALE[lang] ?? 'en_US');
          return 'applied';
        }

        function wireLangPill() {
          document.querySelectorAll('.lang-pill button[data-lang]').forEach((btn) => {
            btn.addEventListener('click', () => setLang(btn.dataset.lang, true));
          });
        }

        function wireMobileMenu() {
          const toggle = document.getElementById('menu-toggle');
          const menu = document.getElementById('mobile-menu');
          if (!toggle || !menu) return;
          toggle.addEventListener('click', () => {
            const open = menu.classList.toggle('hidden') === false;
            toggle.setAttribute('aria-expanded', String(open));
            const dict = dictionaries[currentLang] || {};
            toggle.setAttribute('aria-label', dict[open ? 'nav.menuClose' : 'nav.menuOpen'] || '');
          });
          menu.querySelectorAll('a').forEach((a) =>
            a.addEventListener('click', () => {
              menu.classList.add('hidden');
              toggle.setAttribute('aria-expanded', 'false');
            })
          );
        }

        function wireNavScroll() {
          const nav = document.getElementById('site-nav');
          if (!nav) return;
          function update() { nav.classList.toggle('scrolled', window.scrollY > 20); }
          update();
          window.addEventListener('scroll', update, { passive: true });
        }

        function wireVideoModal() {
          const open = document.getElementById('open-video');
          const modal = document.getElementById('video-modal');
          const close = document.getElementById('close-video');
          const video = document.getElementById('demo-video');
          if (!open || !modal || !close) return;
          let lastFocused = null;
          function openModal() {
            lastFocused = document.activeElement;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            close.focus();
            document.body.style.overflow = 'hidden';
          }
          function closeModal() {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            try { video.pause(); video.currentTime = 0; } catch (e) {}
            document.body.style.overflow = '';
            if (lastFocused) lastFocused.focus();
          }
          open.addEventListener('click', openModal);
          close.addEventListener('click', closeModal);
          modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
          document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !modal.classList.contains('hidden')) closeModal();
          });
        }

        function wireForm() {
          const form = document.getElementById('early-access-form');
          const status = document.getElementById('form-status');
          const submit = document.getElementById('form-submit');
          if (!form) return;
          form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (form.website && form.website.value) return;
            const dict = dictionaries[currentLang] || {};
            if (!form.reportValidity()) return;

            submit.disabled = true;
            const originalSpan = submit.querySelector('span');
            const original = originalSpan ? originalSpan.textContent : '';
            if (originalSpan) originalSpan.textContent = dict['form.submitting'] || 'Sending…';
            status.classList.add('hidden');

            const action = form.getAttribute('action') || '';
            const isPlaceholder = action.indexOf('{{') !== -1;

            try {
              if (isPlaceholder) {
                await new Promise((r) => setTimeout(r, 600));
              } else {
                const fd = new FormData(form);
                const res = await fetch(action, {
                  method: 'POST',
                  body: fd,
                  headers: { Accept: 'application/json' },
                });
                if (!res.ok) throw new Error('Network error');
              }
              status.textContent = dict['form.success'] || 'Thank you!';
              status.classList.remove('hidden');
              status.style.color = '#1AADA3';
              form.reset();
            } catch (err) {
              status.textContent = dict['form.error'] || 'Something went wrong.';
              status.classList.remove('hidden');
              status.style.color = '#C0472E';
            } finally {
              submit.disabled = false;
              if (originalSpan) originalSpan.textContent = original;
            }
          });
        }

        function wireReveals() {
          const els = document.querySelectorAll('.reveal');
          if (!('IntersectionObserver' in window) || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            els.forEach((el) => el.classList.add('visible'));
            return;
          }
          const io = new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                entry.target.classList.add('visible');
                io.unobserve(entry.target);
              }
            });
          }, { threshold: 0.15 });
          els.forEach((el) => io.observe(el));
        }

        // [ROUND 2] This comment used to claim the destinations live "in ONE place
        // (B41)". They do not: the eight markup hrefs are absolute so the doors
        // work without JS, and this map feeds the script-built pricing doors. Two
        // sources, stated plainly. What keeps them from drifting is the gate,
        // which pins every href against its own constants.
        // Both apps declare
        // `signIn: '/'` and `signUp: '/signup'` in their own routes.ts, so the ROOT
        // is the sign-in page when signed out. These domains change at handover and
        // must change once. The hrefs are also written ABSOLUTE in the markup so the
        // links work with JavaScript disabled; this map is what 18A-2 will use to
        // decorate them with ?lang=, in one function rather than eight elements.
        // The API the pricing section asks for today's prices. Same origin
        // family as the apps; changes once, at handover, with the two below.
        const API_BASE = 'https://backend-production-101a3.up.railway.app';

        const AUTH = {
          talent: 'https://talent-web-production-a964.up.railway.app',
          recruiter: 'https://recruiter-web-production-ded4.up.railway.app',
          signIn: '/',
          signUp: '/signup',
        };

        // [18A-1] Native <details> gives us keyboard operation and no-JS survival.
        // It does NOT give us Escape-to-close, click-outside-to-close, or mutual
        // exclusion with the mobile drawer - two stacked overlays on a 320px screen
        // is the bug this prevents.
        // [18A-2] Carry the reader's language across the brand seam.
        //
        // ADR-024 names this as the specific thing that breaks in practice: the
        // site holds the language in its own state, hands off, and the app starts
        // from the browser instead - so somebody reading in French on a borrowed
        // English machine lands on an English sign-up form, at the exact moment
        // they are being asked to trust us with their identity.
        //
        // The PRODUCT side of this was already built and already tested: both web
        // apps' `resolveInitialLocale` reads `?lang=` and ranks it ABOVE the
        // browser, and both carry a `handoff.test.ts` written against ADR-024.
        // The only missing half was this one - the site never sent it.
        //
        // Two things this deliberately does NOT do, because the product side has
        // already decided them and the code wins:
        //   - it does not strip the parameter after use. `?lang=` is not a secret
        //     (18-2's URL rule is about identifiers), and leaving it means a
        //     shared or bookmarked link keeps the language it was read in.
        //   - it does not try to stop the app saving it. 18-11's H6 fix rules
        //     that a `?lang=` handed over from here IS an explicit choice - she
        //     picked French on this page - as opposed to a `navigator.languages`
        //     guess, which must never overwrite a choice. That is correct.
        /**
         * [REVIEW FIX - H6 REOPENED THROUGH THIS SEAM] Only hand over a language
         * the visitor actually CHOSE.
         *
         * The product side treats any `?lang=` from here as an explicit act:
         * `localeWasChosen()` returns true and SessionGate PATCHes
         * `/me/prefs/locale`, which decides the language of every email that
         * account receives, on every device.
         *
         * This function ran on the INITIAL load too, so a visitor who had
         * touched nothing still sent `?lang=en` from an English-default
         * machine. Reproduced live. The consequence is exactly 18-11's H6: a
         * talent whose preference is French opens the site once on a borrowed
         * laptop, signs in, and every OTP and interview email switches to
         * English - durably, invisibly, on her own phone.
         *
         * A browser's default is a GUESS. Only a click on the pill, or a value
         * this site persisted because of one, is a choice. When it is a guess we
         * send nothing and let the app apply its own rule, which is what it is
         * for.
         */
        function decorateAuthLinks(lang) {
          const chosen = langWasChosen;
          document.querySelectorAll('a[data-auth-link]').forEach((a) => {
            // [ROUND 2] This try/catch's comment used to promise that "a
            // malformed href is a bug for the gate to catch". It cannot be:
            // `a.href` is always an absolute, already-resolved URL, so this
            // `new URL` does not throw on a bad attribute. The guard stays -
            // one broken door must never abort decorating the other thirteen -
            // but what catches a wrong href is the gate's section 1, which pins
            // every door against its own constants.
            try {
              const u = new URL(a.href);
              if (chosen) u.searchParams.set('lang', lang);
              else u.searchParams.delete('lang');
              a.href = u.toString();
            } catch (_) {
              /* Unreachable in today's browsers; kept as a firewall. */
            }
          });
        }

        // [18A-6] THE PRICES. Fetched, never typed.
        //
        // `GET /public/plans` resolves every figure through `resolvePlanPrice`,
        // the same function that bills, so this page cannot disagree with the
        // till. See that route's header for why a public catalogue is safe now
        // when 18-9 SS4.7 refused one.
        //
        // Two rules this obeys and a static pricing page usually does not:
        //   1. NOTHING IS PERSISTED CLIENT-SIDE - no price in localStorage, no
        //      price in the markup. [ROUND 2] This used to say "nothing is cached"
        //      and that was false: the endpoint sends `public, max-age=300`, so a
        //      browser or proxy may serve a response up to five minutes old. That
        //      bound is deliberate and stated in the route's header; what is
        //      forbidden is an UNBOUNDED stale price, which is what persisting one
        //      would be.
        //   2. FAILURE STILL RENDERS. If the API is unreachable the cards are
        //      built anyway, from i18n, with "see current pricing when you sign
        //      up" in place of the number. The visitor loses a figure and keeps
        //      a route. A blank section, or a 0, would be worse than either.
        const PLANS_URL = API_BASE + '/public/plans';

        /** Only subscriptions belong on a marketing page. */
        function isMarketable(plan) {
          return plan.kind === 'subscription';
        }

        /**
         * The period a price is charged over.
         *
         * [REVIEW FIX] This used to bucket `duration_days` with thresholds:
         * >=360 year, >=85 quarter, >=25 month, else week. A price is a number
         * PER UNIT OF TIME, and the endpoint goes to real lengths to guarantee
         * the digits come from the function that bills - while the unit was
         * being reconstructed here from a table nobody tested.
         *
         * The harm was concrete and reachable from the admin panel alone: a plan
         * at 28 days read "per month", so somebody buying "monthly" got three
         * days less than the word promised; 14 days read "per week", advertising
         * double the true rate.
         *
         * Now: only an EXACT canonical duration gets a friendly word. Anything
         * else states the real number of days, which is always true.
         */
        function planPeriod(dict, plan) {
          const exact = { 7: 'pricing.per.week', 30: 'pricing.per.month',
                          90: 'pricing.per.quarter', 365: 'pricing.per.year' };
          const key = exact[plan.duration_days];
          if (key) return dict[key] || '';
          const n = Number(plan.duration_days);
          return Number.isFinite(n) && n > 0 ? (dict['pricing.per.days'] || '').replace('{n}', n) : '';
        }

        /**
         * XOF has NO MINOR UNIT - 1500 is "1 500 F CFA", never "1 500,00".
         * Formatted here rather than on the server, which does not know the
         * reader's language and should not carry a presentation decision.
         */
        function formatPrice(amount, currency, lang) {
          // [REVIEW FIX] `Intl.format(null)` is 0, so a nulled column used to
          // render "F CFA 0" on a live pricing page. An unusable figure must
          // fall back to the placeholder text, never to a number.
          if (typeof amount !== 'number' || !Number.isFinite(amount)) return '';
          // [REVIEW FIX, round 2] Intl's CURRENCY style has no symbol for XOF in
          // Spanish, so the live ES page read "1500 XOF" and "12.000 XOF" beside
          // "1 500 F CFA" in French - a raw ISO code, and four-digit prices left
          // ungrouped because Spanish groups only from five digits. So the NUMBER
          // is formatted by locale with grouping forced on, and the currency label
          // comes from i18n, where it reads "F CFA" in all three languages. The
          // grouping separator still follows the reader's locale.
          let number;
          try {
            number = new Intl.NumberFormat(lang, {
              maximumFractionDigits: 0, useGrouping: true,
            }).format(amount);
          } catch (_) {
            number = String(amount);
          }
          const label = currency === 'XOF'
            ? (currentDict['pricing.currency'] || 'F CFA')
            : currency;
          return number + '\u00a0' + label;
        }

        /**
         * Build one card as DOM NODES, never as an HTML string.
         *
         * [REVIEW FIX - CRITICAL] `plan.name` is a free-text column an ADMIN
         * edits, and it used to be concatenated into an `innerHTML` string on
         * this live public page. A plan named `Pro<img src=x onerror="...">`
         * EXECUTES. (`<script>` inserted via innerHTML does not, which is why a
         * casual test looks safe and the hole was real.)
         *
         * The payload that mattered was never an alert(): it was one line that
         * repoints every `[data-auth-link]` on the page at a phishing clone -
         * every sign-up and log-in door on the client's main acquisition page,
         * from their own domain, under their own certificate, on a product that
         * handles identity and payments.
         *
         * `textContent` makes a name TEXT. It cannot become markup, so the class
         * is gone rather than one instance of it patched - and a plan called
         * "Talent & Pro" or "Pro < 10 offres" now renders correctly instead of
         * silently eating the rest of the card.
         */
        function planCard(dict, lang, plan, href, ctaKey) {
          const card = document.createElement('article');
          card.className = 'pricing-card';

          const name = document.createElement('h4');
          name.className = 'pricing-name';
          // A null/blank name falls back to the plan CODE rather than rendering
          // the literal word "null", which is what `plan ? plan.name : ''` did.
          name.textContent = (plan && (plan.name || plan.code)) || '';
          // [18A-7 review] A name that fell back to another language says so -
          // "Hebdomadaire" on the Spanish page is French, and a screen reader
          // should pronounce it as French. `name_locale` is null when the name is
          // the admin's own label, whose language nobody recorded.
          if (plan && plan.name_locale && plan.name_locale !== lang) name.lang = plan.name_locale;
          // An empty heading is an accessibility failure; drop it entirely on the
          // placeholder card rather than leaving a blank one to navigate into.
          if (name.textContent) card.appendChild(name);

          if (plan) {
            const amount = document.createElement('div');
            amount.className = 'pricing-amount';
            amount.textContent = formatPrice(plan.price_xof, plan.currency, lang);
            const period = document.createElement('div');
            period.className = 'pricing-period';
            period.textContent = planPeriod(dict, plan);
            card.appendChild(amount);
            card.appendChild(period);
          } else {
            const pending = document.createElement('div');
            pending.className = 'pricing-pending';
            pending.textContent = dict['pricing.seeAtSignup'] || '';
            card.appendChild(pending);
          }

          const cta = document.createElement('a');
          cta.className = 'pricing-cta';
          cta.setAttribute('data-auth-link', '');
          cta.href = href;
          cta.textContent = dict[ctaKey] || '';
          card.appendChild(cta);
          return card;
        }

        async function renderPricing(dict, lang) {
          const talent = document.getElementById('pricing-talent');
          const recruiter = document.getElementById('pricing-recruiter');
          if (!talent || !recruiter) return;

          // [REVIEW FIX] A HANG is not a rejection. The old code awaited a bare
          // fetch with no timeout, so on a cold start or a bad mobile connection
          // the section stayed EMPTY - the one state the comment promised was
          // impossible - for as long as the socket stayed open. The gate only
          // ever tested an instant 500, which proves the rejected path and
          // leaves the pending one, the common one, untested.
          let plans = null;
          try {
            const ctl = new AbortController();
            const timer = setTimeout(() => ctl.abort(), 6000);
            try {
              // [18A-7] Ask for plan NAMES in the language on screen. The query
              // string is the whole cache key on the server, so French and
              // English visitors never share a cached response. A backend that
              // predates this simply ignores the parameter and names plans the
              // old way - the page works against either.
              const url = PLANS_URL + '?locale=' + encodeURIComponent(lang);
              const res = await fetch(url, { credentials: 'omit', signal: ctl.signal });
              if (res.ok) {
                const body = await res.json();
                // `|| []` catches MISSING, not WRONG-TYPED. A non-array `plans`
                // used to throw inside build(), outside this try, leaving both
                // columns blank and skipping the link decoration below.
                plans = Array.isArray(body && body.plans) ? body.plans : [];
              }
            } finally {
              clearTimeout(timer);
            }
          } catch (_) {
            /* Deliberately swallowed - the fallback below IS the handling. */
          }

          // [REVIEW FIX] A slow render must not overwrite a newer one. Two
          // language clicks put two fetches in flight, and the LAST TO RESOLVE
          // used to win rather than the last requested - so a slow French render
          // could land after an English one and rewrite every door on the page
          // to ?lang=fr. That is exactly the hand-off failure ADR-024 names.
          if (lang !== currentLang) return;

          const build = (el, audience, href, ctaKey) => {
            const mine = plans
              ? plans.filter((p) => p && p.audience === audience && isMarketable(p))
              : [];
            el.replaceChildren(
              ...(mine.length
                ? mine.map((p) => planCard(dict, lang, p, href, ctaKey))
                // One placeholder card rather than none: the section must never
                // be an empty hole, and the door must still be reachable.
                : [planCard(dict, lang, null, href, ctaKey)]),
            );
          };
          build(talent, 'talent', AUTH.talent + AUTH.signUp, 'pricing.cta.talent');
          build(recruiter, 'recruiter', AUTH.recruiter + AUTH.signUp, 'pricing.cta.recruiter');

          // The cards are built AFTER the links were decorated, so they need the
          // language too - otherwise the eight original doors carry it and these
          // two do not, which is the kind of gap nobody notices by hand.
          decorateAuthLinks(lang);
        }

        function wireLoginMenu() {
          const menu = document.getElementById('login-menu');
          if (!menu) return;
          const summary = menu.querySelector('summary');

          document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && menu.open) {
              menu.open = false;
              if (summary) summary.focus();
            }
          });

          document.addEventListener('click', (e) => {
            if (menu.open && !menu.contains(e.target)) menu.open = false;
          });

          // Opening either overlay closes the other.
          menu.addEventListener('toggle', () => {
            if (!menu.open) return;
            const drawer = document.getElementById('mobile-menu');
            const toggle = document.getElementById('menu-toggle');
            if (drawer && !drawer.classList.contains('hidden')) {
              drawer.classList.add('hidden');
              if (toggle) toggle.setAttribute('aria-expanded', 'false');
            }
          });

          const toggle = document.getElementById('menu-toggle');
          if (toggle) toggle.addEventListener('click', () => { menu.open = false; });
        }

        document.addEventListener('DOMContentLoaded', async () => {
          wireLangPill();
          wireLoginMenu();
          wireMobileMenu();
          wireNavScroll();
          wireVideoModal();
          wireForm();
          wireReveals();
          // [REVIEW FIX, round 2] If the preferred dictionary will not load,
          // try the others before giving up. A blank marketing page is worse
          // than the right page in the wrong language.
          const first = detectInitialLang();
          const order = [first, ...SUPPORTED.filter((l) => l !== first)];
          for (const l of order) {
            // Only a FAILED load falls through. Applied or superseded both mean
            // the page now shows the right thing, or the visitor has chosen.
            if ((await setLang(l, false)) !== 'failed') break;
          }
        });
      })();
    </script>
  </body>
</html>
